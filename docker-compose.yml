services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chatbot-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Backend
      dockerfile: ChatBot.Api/Dockerfile
    container_name: chatbot-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ChatBotDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      Jwt__Secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"
      Jwt__Issuer: "ChatBot.Api"
      Jwt__Audience: "ChatBot.Client"
      AzureOpenAI__Endpoint: "${AZURE_OPENAI_ENDPOINT}"
      AzureOpenAI__ApiKey: "${AZURE_OPENAI_API_KEY}"
      AzureOpenAI__ChatDeploymentName: "gpt-4o"
      AzureOpenAI__EmbeddingDeploymentName: "text-embedding-3-small"
      AzureSearch__Endpoint: "${AZURE_SEARCH_ENDPOINT}"
      AzureSearch__ApiKey: "${AZURE_SEARCH_API_KEY}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    volumes:
      - api-uploads:/app/UploadedDocuments
      - api-logs:/app/Logs

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"

volumes:
  sqlserver-data:
  api-uploads:
  api-logs:
